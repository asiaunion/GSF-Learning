name: Validate Curriculum

on:
  push:
    branches: [main]
    paths:
      - 'curriculum.js'
      - 'scripts/validate-curriculum.js'
  pull_request:
    branches: [main]
    paths:
      - 'curriculum.js'
      - 'scripts/validate-curriculum.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run curriculum validator
        run: node scripts/validate-curriculum.js
